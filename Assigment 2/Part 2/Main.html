<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Planet data table</title>
    <link href="stylesheet.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <h1>Planet data table</h1>
      <table>
        <colgroup> 
          <col span="2" /><!-- This tells the computer to make the 2nd coloumn the inital position since the fiorst one will be blank-->
          <col class="column-border" /> <!-- This sets up the charts styling from the CSS-->
          <col span="1" />
          </colgroup>
  
       <thead>
         <tr>
           <th colspan="2"></th>
           <th>Name</th>
           <th>Mass (10^24kg)</th>
           <th>Diameter KM</th>
           <th>Density(kg/m^3)</th>
           <th>Gravity(m/s^2)</th>
           <th>Length of day (hours)</th>
           <th>Distance from sun (10^6km)</th>
           <th>Mean Temperature (C)</th>
           <th>Number of Moons</th>
           <th>Notes</th>
         </tr>
       </thead>
    </table>
  </body>
</html>
